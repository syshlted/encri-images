#
# Single source of truth for dependency versions.
#
# The toolchain is encri's and encri-api's, version for version (AGENTS.md I1): this app builds against
# encri-client, which builds against the same Kotlin and AGP, so a bump is made in all of them together.

[versions]
agp = "9.4.1"
# Newer than the 2.2.10 AGP 9.4.1 depends on, which has a build-cache deserialization flaw fixed in
# 2.4.20 (GHSA-r937-wjx7-w2jp). On the root classpath, so AGP's built-in Kotlin compiles with it too
# (encri D119, encri-api L9).
kotlin = "2.4.21"
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
junit = "5.14.4"
robolectric = "4.17"
coroutines = "1.10.2"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

# minSdk 27, encri's floor (encri D14) and therefore the lowest level this app can ever find encri on.
minSdk = "27"
compileSdk = "36"
targetSdk = "36"

# The app's libraries, at the versions Glimpse was forked with (I1).
activity = "1.12.0-alpha08"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
core = "1.18.0-alpha01"
exifinterface = "1.4.0-alpha01"
fragment = "1.8.9"
glide = "5.0.5"
lifecycle = "2.10.0-alpha04"
material = "1.14.0-alpha10"
media3 = "1.10.0"
navigation = "2.9.7"
preference = "1.2.1"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
xmpcore = "6.1.11"
zoomimage = "1.4.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# The client library, which is the only way this app reaches the vault. Substituted by the included
# build in settings.gradle.kts until it is published; the version is the included build's own.
encri-client = { module = "com.systemhalted.encri:encri-client", version = "0.1.0-SNAPSHOT" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit4 = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
adobe-xmpcore = { group = "com.adobe.xmp", name = "xmpcore", version.ref = "xmpcore" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-media3-common-ktx = { group = "androidx.media3", name = "media3-common-ktx", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
zoomimage-view-glide = { group = "io.github.panpf.zoomimage", name = "zoomimage-view-glide", version.ref = "zoomimage" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
